name: Backend CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  ci:
    name: Lint, Test, and Audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      JWT_SECRET: test-secret-key-with-at-least-32-bytes
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      MINIO_ENDPOINT: "localhost:9000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest --cov=app --cov-report=xml

      - name: Pip audit
        run: pip-audit

      - name: Detect SonarQube inputs
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  release_bundle:
    name: Package Demo Bundle
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          tar \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            --exclude='./.ruff_cache' \
            --exclude='./__pycache__' \
            --exclude='./portfolio_backend.egg-info' \
            --exclude='./.coverage' \
            --exclude='./dist' \
            -czf "dist/portfolio-backend-${version}-${short_sha}.tar.gz" \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-backend-bundle
          path: dist/*.tar.gz

  detect_release_inputs:
    name: Detect Release Inputs
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
      has_registry_credentials: ${{ steps.detect.outputs.has_registry_credentials }}
      has_deploy_credentials: ${{ steps.detect.outputs.has_deploy_credentials }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -f Dockerfile ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_registry_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_registry_credentials=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_PORT" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "has_deploy_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_credentials=false" >> "$GITHUB_OUTPUT"
          fi

  publish_container:
    name: Publish Demo Container
    runs-on: ubuntu-latest
    needs:
      - detect_release_inputs
      - release_bundle
    if: needs.detect_release_inputs.outputs.has_dockerfile == 'true' && needs.detect_release_inputs.outputs.has_registry_credentials == 'true'
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy_demo:
    name: Demo Deploy
    runs-on: ubuntu-latest
    needs:
      - detect_release_inputs
      - publish_container
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.detect_release_inputs.outputs.has_dockerfile == 'true' && needs.detect_release_inputs.outputs.has_deploy_credentials == 'true'
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: /opt/portfolio/scripts/deploy.sh backend ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notify
        if: always()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            exit 0
          fi

          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{"service":"backend","status":"'"${{ job.status }}"'","sha":"'"${{ github.sha }}"'"}' \
            "$DEPLOY_WEBHOOK_URL"

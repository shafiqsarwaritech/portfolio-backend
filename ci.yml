workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - validate
  - security
  - package
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: "sqlite+pysqlite:///:memory:"
  JWT_SECRET: "test-secret-key-with-at-least-32-bytes"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "admin123"
  MINIO_ENDPOINT: "localhost:9000"

cache:
  key: "pip-${CI_PROJECT_NAME}"
  paths:
    - .cache/pip

.python_job:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"

lint:
  extends: .python_job
  stage: validate
  script:
    - ruff check .

test:
  extends: .python_job
  stage: validate
  script:
    - pytest --cov=app --cov-report=xml
  artifacts:
    when: always
    paths:
      - coverage.xml

dependency_audit:
  extends: .python_job
  stage: security
  script:
    - pip-audit

sonarqube:
  stage: security
  image: sonarsource/sonar-scanner-cli:latest
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL'
    - when: never
  script:
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"

release_bundle:
  stage: package
  image: alpine:3.20
  needs:
    - lint
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - version="$(tr -d '\n' < VERSION)"
    - short_sha="$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-7)"
    - mkdir -p dist
    - |
      tar \
        --exclude='./.venv' \
        --exclude='./.pytest_cache' \
        --exclude='./.ruff_cache' \
        --exclude='./__pycache__' \
        --exclude='./portfolio_backend.egg-info' \
        --exclude='./.coverage' \
        --exclude='./dist' \
        -czf "dist/portfolio-backend-${version}-${short_sha}.tar.gz" \
        .
  artifacts:
    paths:
      - dist/*.tar.gz

publish_container:
  stage: package
  image: docker:27.1.1-cli
  services:
    - docker:27.1.1-dind
  needs:
    - release_bundle
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"

deploy_demo:
  stage: deploy
  image: alpine:3.20
  needs:
    - publish_container
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - apk add --no-cache curl openssh-client
  script:
    - |
      if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_PORT:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
        echo "Deployment variables not configured; skipping deploy."
        exit 1
      fi
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
    - ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "REGISTRY_HOST='$CI_REGISTRY' REGISTRY_USERNAME='$CI_REGISTRY_USER' REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' /opt/portfolio/scripts/deploy.sh backend $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ -n "${DEPLOY_WEBHOOK_URL:-}" ]; then
        curl -X POST \
          -H 'Content-Type: application/json' \
          -d "{\"service\":\"backend\",\"status\":\"success\",\"sha\":\"$CI_COMMIT_SHA\"}" \
          "$DEPLOY_WEBHOOK_URL"
      fi
